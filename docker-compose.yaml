services:
  db:
    image: mysql:8.0
    container_name: pipette_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: pipette
      MYSQL_USER: pipette
      MYSQL_PASSWORD: pipette_secret
    volumes:
      # База данных сохраняется в проекте: ./mysqldata
      - ./mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upipette", "-ppipette_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: pipette_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pipette
      DB_USER: pipette
      DB_PASSWORD: pipette_secret
      JWT_SECRET: 7f3a9c2e8b1d4f6a0e5c7b9d2f4a6c8e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a
    depends_on:
      db:
        condition: service_healthy
    volumes: 
     # Фронтенд можно править без пересборки
      - ./frontend:/app/frontend
