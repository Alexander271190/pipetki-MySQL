services:
  db:
    image: mysql:8.0.46
    container_name: pipette_db
    restart: unless-stopped

    # 🆕 Дать MySQL время корректно завершиться (уберет XA crash recovery)
    stop_grace_period: 60s

    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: Seno16/1978S
      MYSQL_DATABASE: pipette
      MYSQL_USER: pipette
      MYSQL_PASSWORD: Seno16/1978S
      TZ: Asia/Krasnoyarsk
    volumes:
      - ./mysqldata:/var/lib/mysql

    # 🆕 Healthcheck: реальный SELECT под пользователем приложения
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

    # ❌ ports убран — MySQL доступен только внутри docker-сети

  # ═══════════════════════════════════════════════════════════
  # app — приложение Node.js
  # Порт 3000 наружу НЕ пробрасывается.
  # Трафик: Интернет → Nginx (443) → app:3000
  # ═══════════════════════════════════════════════════════════
  app:
    build: .
    container_name: pipette_app
    restart: unless-stopped

    expose:
      - "3000"

    environment:
      PORT: 3000
      TZ: Asia/Krasnoyarsk
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pipette
      DB_USER: pipette
      DB_PASSWORD: Seno16/1978S
      JWT_SECRET: 7f3a9c2e8b1d4f6a0e5c7b9d2f4a6c8e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a

    depends_on:
      db:
        condition: service_healthy

    # 🆕 Healthcheck: app реально отвечает на /api/health
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════════
  # nginx — HTTPS-терминация + reverse proxy
  # Наружу открыты только 80 (редирект) и 443 (HTTPS)
  # ═══════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: pipette_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/pipette.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro

    depends_on:
      app:
        condition: service_healthy    # 🆕 nginx стартует только когда app готов

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  # certbot — получение + автообновление сертификатов
  # Каждые 12 часов: certbot renew → HUP nginx (graceful reload)
  # ═══════════════════════════════════════════════════════════
  certbot:
    image: certbot/certbot
    container_name: pipette_certbot
    restart: unless-stopped

    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock

    entrypoint: |
      /bin/sh -c '
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          curl -s --unix-socket /var/run/docker.sock \
            -X POST "http://localhost/containers/pipette_nginx/kill?signal=HUP" \
            >/dev/null 2>&1 || true
          sleep 12h & wait $${!}
        done
      '
