# ═══════════════════════════════════════════════════════════
# Nginx для HTTPS на IP-адрес
# TLS 1.2/1.3, security headers, rate limit на логин
# ═══════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=login_zone:10m rate=30r/m;

# Правило для корректного Upgrade только когда он реально нужен
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# ── HTTP: Проверка сертификатов + редирект ──
server {
    listen 80;
    server_name 5.189.243.15;

    # Открываем весь путь .well-known/ для любых проверок (ACME, ZeroSSL и т.д.)
    location /.well-known/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl;
    http2 on;
    server_name 5.189.243.15;

    ssl_certificate     /etc/letsencrypt/live/5.189.243.15/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5.189.243.15/privkey.pem;

    # ── TLS ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── 🆕 Общие лимиты (применяются ко всем location) ──
    client_max_body_size 50M;          # импорт Excel (base64 ~50 МБ)
    client_body_timeout  300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;        # долгие экспорты/импорты

    # ── Заголовки безопасности ──
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(self)" always;

    # ── Rate limit на логин ──
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 🆕 Health-check без авторизации (для мониторинга IT) ──
    location = /api/health {
        proxy_pass http://app:3000;
        access_log off;
    }

    # ── 🆕 Экспорт и печать — без буферизации, файлы могут быть большими ──
    location ~ ^/api/(export|barcodes) {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── Всё остальное ──
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;   # 🆕 вместо хардкода "upgrade"
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
