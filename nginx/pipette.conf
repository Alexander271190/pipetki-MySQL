# ═══════════════════════════════════════════════════════════
# Конфиг Nginx для HTTPS на IP-адрес
# Защита: TLS 1.2/1.3, security headers, rate limit на логин
# ═══════════════════════════════════════════════════════════

# Rate limit: 30 запросов в минуту на IP + 5 сверх (burst)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=30r/m;

# ── HTTP: только ACME-челлендж + редирект на HTTPS ──
server {
    listen 80;
    server_name 5.189.243.15;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: проксирует всё в Node.js (app:3000) ──
server {
    listen 443 ssl;
    http2 on;
    server_name 5.189.243.15;

    ssl_certificate     /etc/letsencrypt/live/5.189.243.15/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5.189.243.15/privkey.pem;

    # ── TLS: только современные версии ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Заголовки безопасности ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    # ── Rate limit на логин ──
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Всё остальное — обычное проксирование ──
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}