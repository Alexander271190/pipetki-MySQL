services:
  db:
    image: mysql:8.0
    container_name: pipette_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: Seno16/1978S
      MYSQL_DATABASE: pipette
      MYSQL_USER: pipette
      MYSQL_PASSWORD: Seno16/1978S
      TZ: Asia/Krasnoyarsk
    volumes:
      - ./mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upipette", "-pSeno16/1978S"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "3306:3306"

  # ═══════════════════════════════════════════════════════════
  # app — приложение Node.js
  # Порт 3000 наружу НЕ пробрасывается.
  # Трафик идёт: Интернет → Nginx (443) → app:3000
  # ═══════════════════════════════════════════════════════════
  app:
    build: .
    container_name: pipette_app
    restart: unless-stopped

    # app доступен только внутри docker-сети по имени `app:3000`
    expose:
      - "3000"

    environment:
      PORT: 3000
      TZ: Asia/Krasnoyarsk
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pipette
      DB_USER: pipette
      DB_PASSWORD: Seno16/1978S
      JWT_SECRET: 7f3a9c2e8b1d4f6a0e5c7b9d2f4a6c8e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend

  # ═══════════════════════════════════════════════════════════
  # nginx — HTTPS-терминация + reverse proxy
  # Наружу открыты только 80 (редирект на HTTPS) и 443 (HTTPS)
  # ═══════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: pipette_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pipette.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - app

  # ═══════════════════════════════════════════════════════════
  # certbot — получение + автообновление сертификатов
  # Каждые 12 часов: certbot renew → HUP nginx (graceful reload)
  # ═══════════════════════════════════════════════════════════
  certbot:
    image: certbot/certbot
    container_name: pipette_certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: |
      /bin/sh -c '
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          curl -s --unix-socket /var/run/docker.sock \
            -X POST "http://localhost/containers/pipette_nginx/kill?signal=HUP" \
            >/dev/null 2>&1 || true
          sleep 12h & wait $${!}
        done
      '